<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Family Budget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --blue-950: #08233a;
      --blue-900: #0f2b46;
      --blue-800: #163a5a;
      --blue-700: #1d4a6f;
      --blue-600: #255a84;
      --blue-500: #2f6f9f;
      --blue-400: #4a8fbd;
      --blue-300: #7fb3d6;
      --blue-200: #b3d4e9;
      --blue-100: #e0f0f9;
      --cream-50: #fffdf7;
      --cream-100: #fff8e9;
      --cream-200: #fff1d4;
      --cream-300: #ffe7b8;
      --cream-400: #ffd794;
      --danger: #b53b43;
      --danger-soft: #fff0ef;
      --success: #1d7b5f;
      --shadow: 0 10px 30px rgba(15, 43, 70, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
      margin: 0;
    }

    body {
      color: var(--blue-900);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, var(--blue-950), var(--blue-700), var(--blue-500));
    }

    button,
    input,
    select {
      font: inherit;
    }

    .wave-bg {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      right: -10%;
      left: -10%;
      height: 42vh;
      opacity: 0.25;
      background: radial-gradient(ellipse at center, var(--cream-200) 0%, transparent 70%);
      filter: blur(40px);
      transform: translateY(-20%);
      animation: float 12s ease-in-out infinite;
    }

    .wave:nth-child(2) {
      top: 39%;
      height: 50vh;
      opacity: 0.20;
      background: radial-gradient(ellipse at center, var(--cream-300) 0%, transparent 70%);
      animation-delay: -4s;
    }

    .wave:nth-child(3) {
      top: 75%;
      height: 45vh;
      opacity: 0.22;
      background: radial-gradient(ellipse at center, var(--cream-100) 0%, transparent 70%);
      animation-delay: -8s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(-20%) scale(1);
      }

      50% {
        transform: translateY(-10%) scale(1.05);
      }
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .period-display,
    .card {
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .period-display {
      flex: 1;
      padding: 14px 18px;
      border-radius: 16px;
      color: var(--blue-800);
      font-weight: 700;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.93), rgba(255, 255, 255, 0.76));
    }

    .card {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.86));
    }

    .section-title {
      margin: 0 0 11px;
      color: var(--blue-800);
      font-size: 1.05rem;
      font-weight: 800;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--blue-400), var(--blue-600));
      box-shadow: 0 6px 18px rgba(15, 43, 70, 0.25);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.secondary {
      color: var(--blue-900);
      background: linear-gradient(135deg, var(--cream-200), var(--cream-300));
    }

    .btn.delete {
      padding: 5px 8px;
      border: 1px solid rgba(181, 59, 67, 0.25);
      color: var(--danger);
      font-size: 0.72rem;
      box-shadow: none;
      background: var(--danger-soft);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 0.7fr auto;
      align-items: end;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--blue-700);
      font-size: 0.8rem;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(15, 43, 70, 0.18);
      border-radius: 10px;
      outline: 0;
      color: var(--blue-900);
      background: rgba(255, 255, 255, 0.92);
    }

    input:focus,
    select:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 3px rgba(74, 143, 189, 0.18);
    }

    .error {
      display: none;
      margin-top: 8px;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* Categories now sit immediately below Add Expense */
    .categories-section {
      margin: 16px 0;
    }

    .expense-category {
      position: relative;
      min-height: 142px;
      padding: 16px;
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cream-100), var(--cream-200));
      box-shadow: 0 8px 22px rgba(15, 43, 70, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .expense-category:hover {
      z-index: 10;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15, 43, 70, 0.24);
    }

    .cat-label {
      margin-bottom: 6px;
      color: var(--blue-700);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .cat-remaining {
      color: var(--blue-900);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .cat-sub {
      margin-top: 4px;
      color: var(--blue-600);
      font-size: 0.8rem;
    }

    .liquid-hover {
      position: absolute;
      z-index: 20;
      top: calc(100% - 5px);
      right: 0;
      left: 0;
      padding-top: 6px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px) scale(0.98);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .expense-category:hover .liquid-hover,
    .expense-category:focus-within .liquid-hover {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .liquid-window {
      max-height: 280px;
      margin: 0 3px;
      padding: 10px 12px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(214, 238, 250, 0.66));
      box-shadow: 0 12px 28px rgba(15, 43, 70, 0.28);
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    .liquid-heading {
      margin-bottom: 5px;
      color: var(--blue-800);
      font-size: 0.74rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .liquid-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(15, 43, 70, 0.15);
      color: var(--blue-800);
      font-size: 0.84rem;
    }

    .liquid-item:last-child {
      border-bottom: 0;
    }

    .expense-detail {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }

    .expense-amount {
      color: var(--blue-900);
      font-weight: 800;
    }

    .liquid-meta {
      color: var(--blue-600);
      font-size: 0.72rem;
    }

    .empty-history {
      color: var(--blue-700);
      font-size: 0.82rem;
    }

    .fixed-list {
      display: grid;
      gap: 8px;
    }

    .fixed-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(15, 43, 70, 0.08);
      border-radius: 12px;
      color: var(--blue-800);
      background: rgba(255, 255, 255, 0.45);
    }

    .fixed-row.paid {
      opacity: 0.72;
      background: rgba(224, 240, 249, 0.72);
    }

    .fixed-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .fixed-check input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--success);
      cursor: pointer;
    }

    .fixed-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fixed-row.paid .fixed-name {
      text-decoration: line-through;
    }

    .fixed-amt {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .paid-badge {
      color: var(--success);
      font-size: 0.71rem;
      font-weight: 900;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(15, 43, 70, 0.12);
    }

    .summary-line:last-child {
      border-bottom: 0;
    }

    .summary-line strong {
      color: var(--blue-900);
    }

    .modal-backdrop {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(8, 35, 58, 0.57);
    }

    .modal {
      width: min(720px, 100%);
      max-height: 90vh;
      padding: 18px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92));
      box-shadow: 0 20px 60px rgba(15, 43, 70, 0.36);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title {
      color: var(--blue-900);
      font-size: 1.12rem;
      font-weight: 900;
    }

    .close-btn {
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      color: var(--blue-700);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      background: transparent;
    }

    .close-btn:hover {
      background: rgba(15, 43, 70, 0.06);
    }

    .settings-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed rgba(15, 43, 70, 0.15);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .fixed-editor-row {
      display: grid;
      grid-template-columns: 1fr 120px auto;
      gap: 8px;
      align-items: center;
    }

    .loading {
      pointer-events: none;
      opacity: 0.62;
    }

    @media (max-width: 900px) {
      .grid.two,
      .grid.four {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .form-row,
      .settings-grid,
      .grid.two,
      .grid.four {
        grid-template-columns: 1fr;
      }

      .fixed-editor-row {
        grid-template-columns: 1fr 105px auto;
      }
    }
  </style>
</head>

<body>
  <div class="wave-bg" aria-hidden="true">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <main class="container">
    <header>
      <div class="period-display" id="periodDisplay">Loading period…</div>

      <div class="header-actions">
        <button class="btn secondary" id="togglePeriodBtn" type="button">Switch Period</button>
        <button class="btn" id="settingsBtn" type="button">Settings</button>
      </div>
    </header>

    <section class="card">
      <h2 class="section-title">Add Expense</h2>

      <form id="expenseForm" class="form-row">
        <div>
          <label for="category">Category</label>
          <select id="category" required>
            <option>Gas</option>
            <option>Groceries</option>
            <option>Eat Out</option>
            <option>Extra</option>
          </select>
        </div>

        <div>
          <label for="amount">Amount ($)</label>
          <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 45" required />
        </div>

        <div>
          <label for="card">Card</label>
          <select id="card" required>
            <option>Chase</option>
            <option>AMEX</option>
            <option>Star Card</option>
          </select>
        </div>

        <div>
          <label>&nbsp;</label>
          <button class="btn" type="submit">Add</button>
        </div>
      </form>

      <div id="formError" class="error"></div>
    </section>

    <!-- MOVED HERE: categories immediately beneath expense entry -->
    <section class="categories-section">
      <h2 class="section-title" style="color: var(--cream-50);">Expense Categories</h2>
      <div class="grid four" id="categoriesGrid"></div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2 class="section-title">Fixed Expenses</h2>
        <div id="fixedList" class="fixed-list">Loading…</div>
      </div>

      <div class="card">
        <h2 class="section-title">Budget Summary</h2>
        <div id="budgetSummary">Loading…</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="settingsTitle">Settings</div>
        <button class="close-btn" id="closeSettingsBtn" type="button" aria-label="Close settings">&times;</button>
      </div>

      <section class="settings-section">
        <h2 class="section-title">Period & Starting Budget</h2>

        <div class="settings-grid">
          <div>
            <label for="setMonth">Month</label>
            <select id="setMonth"></select>
          </div>

          <div>
            <label for="setYear">Year</label>
            <select id="setYear"></select>
          </div>

          <div>
            <label for="setStarting">Starting Budget ($)</label>
            <input id="setStarting" type="number" min="0" step="1" inputmode="numeric" />
          </div>

          <div>
            <label>&nbsp;</label>
            <button class="btn" id="saveBudgetBtn" type="button">Save Budget</button>
          </div>
        </div>

        <div id="budgetError" class="error"></div>
      </section>

      <section class="settings-section">
        <h2 class="section-title">Category Amounts</h2>

        <div class="settings-grid">
          <div>
            <label for="setGas">Gas ($)</label>
            <input id="setGas" type="number" min="0" step="1" inputmode="numeric" />
          </div>

          <div>
            <label for="setGroceries">Groceries ($)</label>
            <input id="setGroceries" type="number" min="0" step="1" inputmode="numeric" />
          </div>

          <div>
            <label for="setEatOut">Eat Out ($)</label>
            <input id="setEatOut" type="number" min="0" step="1" inputmode="numeric" />
          </div>

          <div>
            <label for="setExtra">Extra ($)</label>
            <input id="setExtra" type="number" min="0" step="1" inputmode="numeric" />
          </div>

          <div style="grid-column: 1 / -1;">
            <button class="btn" id="saveCategoriesBtn" type="button">Save Categories</button>
          </div>
        </div>

        <div id="categoriesError" class="error"></div>
      </section>

      <section class="settings-section">
        <h2 class="section-title">Fixed Costs (This Period)</h2>

        <div id="fixedCostsEditor" style="display: grid; gap: 10px;"></div>

        <div style="margin-top: 10px;">
          <button class="btn" id="addFixedBtn" type="button">Add Fixed Cost</button>
          <button class="btn secondary" id="saveFixedBtn" type="button" style="margin-left: 8px;">Save Fixed Costs</button>
        </div>

        <div id="fixedError" class="error"></div>
      </section>
    </div>
  </div>

  <script type="module">
    /*
      Replace the publishable key below with your real sb_publishable_... key.
      Never put a Supabase secret key in this file.
    */
    const SUPABASE_URL = 'https://ffjaqdtdoqkvlrcfqnrx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lwdziY_FYlVNYoTh-Z2oTw_3SoDNDNr';

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MONTHS = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const CATEGORY_KEYS = ['Gas', 'Groceries', 'Eat Out', 'Extra'];

    const DEFAULTS_FIRST_HALF = [
      { name: 'Church', amount: 400 },
      { name: 'Savings', amount: 1000 },
      { name: 'Netflix', amount: 20 },
      { name: 'Apple 1 Family', amount: 38 },
      { name: 'Oura', amount: 12 },
      { name: 'TKS Internet', amount: 90 }
    ];

    const DEFAULTS_SECOND_HALF = [
      { name: 'Church', amount: 400 },
      { name: 'Savings', amount: 1000 },
      { name: 'Prison Fellow Intl', amount: 35 },
      { name: 'HBO Max', amount: 33 },
      { name: 'Tricare Dental', amount: 30 },
      { name: 'NYT Games', amount: 2 }
    ];

    const today = new Date();

    let currentPeriod = {
      startDay: today.getDate() <= 15 ? 1 : 16,
      month: today.getMonth() + 1,
      year: today.getFullYear()
    };

    let settings = null;
    let fixedCosts = [];
    let expensesByCategory = emptyExpenseGroups();

    const periodDisplay = document.getElementById('periodDisplay');
    const togglePeriodBtn = document.getElementById('togglePeriodBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const expenseForm = document.getElementById('expenseForm');
    const formError = document.getElementById('formError');
    const fixedList = document.getElementById('fixedList');
    const budgetSummary = document.getElementById('budgetSummary');
    const categoriesGrid = document.getElementById('categoriesGrid');

    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const setMonth = document.getElementById('setMonth');
    const setYear = document.getElementById('setYear');
    const setStarting = document.getElementById('setStarting');
    const saveBudgetBtn = document.getElementById('saveBudgetBtn');
    const budgetError = document.getElementById('budgetError');
    const setGas = document.getElementById('setGas');
    const setGroceries = document.getElementById('setGroceries');
    const setEatOut = document.getElementById('setEatOut');
    const setExtra = document.getElementById('setExtra');
    const saveCategoriesBtn = document.getElementById('saveCategoriesBtn');
    const categoriesError = document.getElementById('categoriesError');
    const fixedCostsEditor = document.getElementById('fixedCostsEditor');
    const addFixedBtn = document.getElementById('addFixedBtn');
    const saveFixedBtn = document.getElementById('saveFixedBtn');
    const fixedError = document.getElementById('fixedError');

    function emptyExpenseGroups() {
      return { Gas: [], Groceries: [], 'Eat Out': [], Extra: [] };
    }

    function money(value) {
      return `$${Number(value || 0).toLocaleString('en-US', {
        maximumFractionDigits: 0
      })}`;
    }

    function integer(value) {
      return Math.floor(Number(value));
    }

    function total(items, property = 'amount') {
      return items.reduce((sum, item) => sum + Number(item[property] || 0), 0);
    }

    function daysInMonth(month, year) {
      return new Date(year, month, 0).getDate();
    }

    function periodDefaults(startDay) {
      return startDay === 1 ? DEFAULTS_FIRST_HALF : DEFAULTS_SECOND_HALF;
    }

    function periodFixedTotal(startDay) {
      return total(periodDefaults(startDay));
    }

    function currentPeriodKey(period = currentPeriod) {
      return {
        period_start_day: period.startDay,
        month: period.month,
        year: period.year
      };
    }

    function showError(element, message) {
      element.textContent = message;
      element.style.display = 'block';
    }

    function clearError(element) {
      element.textContent = '';
      element.style.display = 'none';
    }

    function formatExpenseDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString('en-US', {
        month: 'numeric',
        day: 'numeric',
        year: '2-digit'
      });
    }

    async function ensureSettings(period) {
      const key = currentPeriodKey(period);

      const { data, error } = await supabase
        .from('budget_settings')
        .select('*')
        .match(key)
        .maybeSingle();

      if (error) throw error;
      if (data) return data;

      const starting = 3000;
      const gas = 200;
      const groceries = 450;
      const eatOut = 100;
      const extra = Math.max(0, starting - periodFixedTotal(period.startDay) - gas - groceries - eatOut);

      const { data: created, error: insertError } = await supabase
        .from('budget_settings')
        .insert({
          ...key,
          starting_amount: starting,
          gas_amount: gas,
          groceries_amount: groceries,
          eat_out_amount: eatOut,
          extra_amount: extra
        })
        .select()
        .single();

      if (insertError) throw insertError;
      return created;
    }

    async function ensureFixedCosts(period) {
      const key = currentPeriodKey(period);

      const { data: existing, error: existingError } = await supabase
        .from('fixed_costs')
        .select('id, name, amount, is_paid')
        .match(key);

      if (existingError) throw existingError;

      const existingNames = new Set((existing || []).map(item => item.name));

      const inserts = periodDefaults(period.startDay)
        .filter(item => !existingNames.has(item.name))
        .map(item => ({
          ...key,
          name: item.name,
          amount: item.amount,
          is_paid: false
        }));

      if (inserts.length) {
        const { error: insertError } = await supabase
          .from('fixed_costs')
          .insert(inserts);

        if (insertError) throw insertError;
      }

      const { data: finalData, error: finalError } = await supabase
        .from('fixed_costs')
        .select('id, name, amount, is_paid')
        .match(key)
        .order('name', { ascending: true });

      if (finalError) throw finalError;
      return finalData || [];
    }

    async function loadExpenses(period) {
      const key = currentPeriodKey(period);

      const { data, error } = await supabase
        .from('expenses')
        .select('id, category, amount, card, created_at')
        .match(key)
        .order('created_at', { ascending: false });

      if (error) throw error;

      const groups = emptyExpenseGroups();

      for (const expense of data || []) {
        if (groups[expense.category]) groups[expense.category].push(expense);
      }

      return groups;
    }

    function categoryBudgets() {
      return {
        Gas: Number(settings.gas_amount),
        Groceries: Number(settings.groceries_amount),
        'Eat Out': Number(settings.eat_out_amount),
        Extra: Number(settings.extra_amount)
      };
    }

    function categorySpent() {
      return {
        Gas: total(expensesByCategory.Gas),
        Groceries: total(expensesByCategory.Groceries),
        'Eat Out': total(expensesByCategory['Eat Out']),
        Extra: total(expensesByCategory.Extra)
      };
    }

    function renderPeriodDisplay() {
      const startDay = currentPeriod.startDay;
      const endDay = startDay === 1 ? 15 : daysInMonth(currentPeriod.month, currentPeriod.year);
      const label = startDay === 1 ? '1st–15th' : `16th–${endDay}`;
      const monthName = MONTHS[currentPeriod.month - 1];

      periodDisplay.textContent = `${monthName} ${startDay}–${endDay}, ${currentPeriod.year} · ${label} Pay Period`;
    }

    function renderFixedList() {
      fixedList.innerHTML = '';

      if (!fixedCosts.length) {
        fixedList.textContent = 'No fixed expenses for this period.';
        return;
      }

      for (const fixed of fixedCosts) {
        const row = document.createElement('div');
        row.className = `fixed-row${fixed.is_paid ? ' paid' : ''}`;

        const checkWrap = document.createElement('label');
        checkWrap.className = 'fixed-check';
        checkWrap.title = fixed.is_paid ? 'Mark as unpaid' : 'Mark as paid';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = Boolean(fixed.is_paid);
        check.setAttribute('aria-label', `Mark ${fixed.name} as paid`);
        check.addEventListener('change', async () => {
          await toggleFixedPaid(fixed.id, check.checked);
        });

        checkWrap.appendChild(check);

        const name = document.createElement('div');
        name.className = 'fixed-name';
        name.textContent = fixed.name;

        const amountWrap = document.createElement('div');
        amountWrap.style.textAlign = 'right';

        const amount = document.createElement('div');
        amount.className = 'fixed-amt';
        amount.textContent = money(fixed.amount);

        amountWrap.appendChild(amount);

        if (fixed.is_paid) {
          const badge = document.createElement('div');
          badge.className = 'paid-badge';
          badge.textContent = 'PAID';
          amountWrap.appendChild(badge);
        }

        row.append(checkWrap, name, amountWrap);
        fixedList.appendChild(row);
      }
    }

    function renderBudgetSummary() {
      if (!settings) {
        budgetSummary.textContent = 'Loading…';
        return;
      }

      const start = Number(settings.starting_amount);
      const fixedTotal = total(fixedCosts);
      const paidFixedTotal = total(fixedCosts.filter(item => item.is_paid));
      const budgets = categoryBudgets();
      const spent = categorySpent();
      const categoryBudgetTotal = Object.values(budgets).reduce((sum, amount) => sum + amount, 0);
      const categorySpentTotal = Object.values(spent).reduce((sum, amount) => sum + amount, 0);
      const categoryRemaining = Object.keys(budgets)
        .reduce((sum, category) => sum + (budgets[category] - spent[category]), 0);

      budgetSummary.innerHTML = `
        <div class="summary-line"><span>Starting budget</span><strong>${money(start)}</strong></div>
        <div class="summary-line"><span>Fixed expenses</span><strong>${money(fixedTotal)}</strong></div>
        <div class="summary-line"><span>Fixed expenses paid</span><strong>${money(paidFixedTotal)}</strong></div>
        <div class="summary-line"><span>Category budgets</span><strong>${money(categoryBudgetTotal)}</strong></div>
        <div class="summary-line"><span>Category spending</span><strong>${money(categorySpentTotal)}</strong></div>
        <div class="summary-line"><span>Category remaining</span><strong>${money(categoryRemaining)}</strong></div>
      `;
    }

    function renderCategories() {
      categoriesGrid.innerHTML = '';

      if (!settings) return;

      const budgets = categoryBudgets();
      const spent = categorySpent();

      for (const category of CATEGORY_KEYS) {
        const card = document.createElement('article');
        card.className = 'expense-category';
        card.tabIndex = 0;

        const label = document.createElement('div');
        label.className = 'cat-label';
        label.textContent = category;

        const remaining = document.createElement('div');
        remaining.className = 'cat-remaining';
        remaining.textContent = money(budgets[category] - spent[category]);

        const sub = document.createElement('div');
        sub.className = 'cat-sub';
        sub.textContent = `${money(spent[category])} spent of ${money(budgets[category])}`;

        const hover = document.createElement('div');
        hover.className = 'liquid-hover';

        const windowEl = document.createElement('div');
        windowEl.className = 'liquid-window';

        const heading = document.createElement('div');
        heading.className = 'liquid-heading';
        heading.textContent = 'Recent expenses · delete if needed';
        windowEl.appendChild(heading);

        const recent = expensesByCategory[category].slice(0, 5);

        if (!recent.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-history';
          empty.textContent = 'No expenses entered yet.';
          windowEl.appendChild(empty);
        } else {
          for (const expense of recent) {
            const row = document.createElement('div');
            row.className = 'liquid-item';

            const detail = document.createElement('div');
            detail.className = 'expense-detail';

            const amount = document.createElement('div');
            amount.className = 'expense-amount';
            amount.textContent = money(expense.amount);

            const meta = document.createElement('div');
            meta.className = 'liquid-meta';
            meta.textContent = `${expense.card} · ${formatExpenseDate(expense.created_at)}`;

            detail.append(amount, meta);

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'btn delete';
            deleteButton.textContent = 'Delete';
            deleteButton.setAttribute(
              'aria-label',
              `Delete ${money(expense.amount)} ${category} expense on ${formatExpenseDate(expense.created_at)}`
            );

            deleteButton.addEventListener('click', async (event) => {
              event.preventDefault();
              event.stopPropagation();

              const confirmed = window.confirm(
                `Delete this ${category} expense for ${money(expense.amount)} charged to ${expense.card}?`
              );

              if (confirmed) {
                await deleteExpense(expense.id);
              }
            });

            row.append(detail, deleteButton);
            windowEl.appendChild(row);
          }
        }

        hover.appendChild(windowEl);
        card.append(label, remaining, sub, hover);
        categoriesGrid.appendChild(card);
      }
    }

    async function toggleFixedPaid(id, isPaid) {
      try {
        document.body.classList.add('loading');

        const { error } = await supabase
          .from('fixed_costs')
          .update({ is_paid: isPaid })
          .eq('id', id);

        if (error) throw error;

        await loadAll();
      } catch (error) {
        console.error(error);
        alert(`Could not update payment status: ${error.message || error}`);
        await loadAll();
      } finally {
        document.body.classList.remove('loading');
      }
    }

    async function deleteExpense(id) {
      try {
        document.body.classList.add('loading');

        const { error } = await supabase
          .from('expenses')
          .delete()
          .eq('id', id);

        if (error) throw error;

        await loadAll();
      } catch (error) {
        console.error(error);
        alert(`Could not delete expense: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    }

    async function loadAll() {
      try {
        document.body.classList.add('loading');
        clearError(formError);
        clearError(budgetError);
        clearError(categoriesError);
        clearError(fixedError);

        settings = await ensureSettings(currentPeriod);
        fixedCosts = await ensureFixedCosts(currentPeriod);
        expensesByCategory = await loadExpenses(currentPeriod);

        renderPeriodDisplay();
        renderCategories();
        renderFixedList();
        renderBudgetSummary();
      } catch (error) {
        console.error(error);
        alert(`Error loading budget data: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    }

    function populateMonthAndYear() {
      for (let month = 1; month <= 12; month += 1) {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = MONTHS[month - 1];
        setMonth.appendChild(option);
      }

      const thisYear = today.getFullYear();
      for (let year = thisYear - 1; year <= thisYear + 3; year += 1) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        setYear.appendChild(option);
      }
    }

    async function ensureSettingsForSelection() {
      const period = {
        startDay: currentPeriod.startDay,
        month: Number(setMonth.value),
        year: Number(setYear.value)
      };

      return ensureSettings(period);
    }

    async function rebuildFixedCostsEditor() {
      fixedCostsEditor.innerHTML = '';

      const selectedPeriod = {
        startDay: currentPeriod.startDay,
        month: Number(setMonth.value),
        year: Number(setYear.value)
      };

      const selectedFixedCosts = await ensureFixedCosts(selectedPeriod);

      for (const fixed of selectedFixedCosts) {
        const row = document.createElement('div');
        row.className = 'fixed-editor-row';

        const name = document.createElement('input');
        name.value = fixed.name;
        name.dataset.id = fixed.id;
        name.dataset.field = 'name';
        name.setAttribute('aria-label', 'Fixed cost name');

        const amount = document.createElement('input');
        amount.type = 'number';
        amount.min = '0';
        amount.step = '1';
        amount.inputMode = 'numeric';
        amount.value = integer(fixed.amount);
        amount.dataset.id = fixed.id;
        amount.dataset.field = 'amount';
        amount.setAttribute('aria-label', `${fixed.name} amount`);

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn secondary';
        deleteButton.textContent = 'Delete';

        deleteButton.addEventListener('click', async () => {
          const confirmed = window.confirm(`Delete fixed cost "${fixed.name}"?`);
          if (!confirmed) return;

          try {
            document.body.classList.add('loading');

            const { error } = await supabase
              .from('fixed_costs')
              .delete()
              .eq('id', fixed.id);

            if (error) throw error;

            await rebuildFixedCostsEditor();

            if (
              selectedPeriod.month === currentPeriod.month &&
              selectedPeriod.year === currentPeriod.year
            ) {
              await loadAll();
            }
          } catch (error) {
            console.error(error);
            alert(`Could not delete fixed cost: ${error.message || error}`);
          } finally {
            document.body.classList.remove('loading');
          }
        });

        row.append(name, amount, deleteButton);
        fixedCostsEditor.appendChild(row);
      }
    }

    togglePeriodBtn.addEventListener('click', () => {
      currentPeriod.startDay = currentPeriod.startDay === 1 ? 16 : 1;
      loadAll();
    });

    settingsBtn.addEventListener('click', async () => {
      try {
        setMonth.value = currentPeriod.month;
        setYear.value = currentPeriod.year;
        setStarting.value = integer(settings.starting_amount);
        setGas.value = integer(settings.gas_amount);
        setGroceries.value = integer(settings.groceries_amount);
        setEatOut.value = integer(settings.eat_out_amount);
        setExtra.value = integer(settings.extra_amount);

        await rebuildFixedCostsEditor();
        settingsModal.style.display = 'flex';
      } catch (error) {
        console.error(error);
        alert(`Could not open settings: ${error.message || error}`);
      }
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    settingsModal.addEventListener('click', event => {
      if (event.target === settingsModal) settingsModal.style.display = 'none';
    });

    expenseForm.addEventListener('submit', async event => {
      event.preventDefault();
      clearError(formError);

      const category = document.getElementById('category').value;
      const amount = integer(document.getElementById('amount').value);
      const card = document.getElementById('card').value;

      if (!CATEGORY_KEYS.includes(category)) {
        showError(formError, 'Choose a valid expense category.');
        return;
      }

      if (!Number.isInteger(amount) || amount <= 0) {
        showError(formError, 'Enter a positive whole-dollar amount.');
        return;
      }

      try {
        document.body.classList.add('loading');

        const { error } = await supabase
          .from('expenses')
          .insert({
            ...currentPeriodKey(),
            category,
            amount,
            card
          });

        if (error) throw error;

        document.getElementById('amount').value = '';
        await loadAll();
      } catch (error) {
        console.error(error);
        showError(formError, `Could not add expense: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    });

    saveBudgetBtn.addEventListener('click', async () => {
      clearError(budgetError);

      const selectedMonth = Number(setMonth.value);
      const selectedYear = Number(setYear.value);
      const starting = integer(setStarting.value);

      if (!Number.isInteger(starting) || starting < 0) {
        showError(budgetError, 'Enter a valid whole-dollar starting budget.');
        return;
      }

      try {
        document.body.classList.add('loading');

        const selectedSettings = await ensureSettingsForSelection();

        const { error } = await supabase
          .from('budget_settings')
          .update({ starting_amount: starting })
          .eq('id', selectedSettings.id);

        if (error) throw error;

        if (selectedMonth === currentPeriod.month && selectedYear === currentPeriod.year) {
          await loadAll();
          setStarting.value = integer(settings.starting_amount);
        } else {
          alert('Starting budget saved for the selected period.');
        }
      } catch (error) {
        console.error(error);
        showError(budgetError, `Could not save budget: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    });

    saveCategoriesBtn.addEventListener('click', async () => {
      clearError(categoriesError);

      const selectedMonth = Number(setMonth.value);
      const selectedYear = Number(setYear.value);
      const gas = integer(setGas.value);
      const groceries = integer(setGroceries.value);
      const eatOut = integer(setEatOut.value);
      const extra = integer(setExtra.value);

      if ([gas, groceries, eatOut, extra].some(value => !Number.isInteger(value) || value < 0)) {
        showError(categoriesError, 'Enter valid whole-dollar category amounts.');
        return;
      }

      try {
        document.body.classList.add('loading');

        const selectedSettings = await ensureSettingsForSelection();

        const { error } = await supabase
          .from('budget_settings')
          .update({
            gas_amount: gas,
            groceries_amount: groceries,
            eat_out_amount: eatOut,
            extra_amount: extra
          })
          .eq('id', selectedSettings.id);

        if (error) throw error;

        if (selectedMonth === currentPeriod.month && selectedYear === currentPeriod.year) {
          await loadAll();
        } else {
          alert('Category amounts saved for the selected period.');
        }
      } catch (error) {
        console.error(error);
        showError(categoriesError, `Could not save category amounts: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    });

    addFixedBtn.addEventListener('click', async () => {
      const selectedMonth = Number(setMonth.value);
      const selectedYear = Number(setYear.value);
      const name = window.prompt('Fixed cost name:');

      if (!name || !name.trim()) return;

      const amountText = window.prompt('Fixed cost amount (whole dollars):', '0');
      if (amountText === null) return;

      const amount = integer(amountText);

      if (!Number.isInteger(amount) || amount < 0) {
        alert('Please enter a valid whole-dollar amount.');
        return;
      }

      try {
        document.body.classList.add('loading');

        const { error } = await supabase
          .from('fixed_costs')
          .insert({
            period_start_day: currentPeriod.startDay,
            month: selectedMonth,
            year: selectedYear,
            name: name.trim(),
            amount,
            is_paid: false
          });

        if (error) throw error;

        await rebuildFixedCostsEditor();

        if (selectedMonth === currentPeriod.month && selectedYear === currentPeriod.year) {
          await loadAll();
        }
      } catch (error) {
        console.error(error);
        alert(`Could not add fixed cost: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    });

    saveFixedBtn.addEventListener('click', async () => {
      clearError(fixedError);

      const selectedMonth = Number(setMonth.value);
      const selectedYear = Number(setYear.value);
      const rows = [...fixedCostsEditor.querySelectorAll('.fixed-editor-row')];

      try {
        document.body.classList.add('loading');

        for (const row of rows) {
          const nameInput = row.querySelector('[data-field="name"]');
          const amountInput = row.querySelector('[data-field="amount"]');

          const name = nameInput.value.trim();
          const amount = integer(amountInput.value);

          if (!name || !Number.isInteger(amount) || amount < 0) {
            throw new Error('Each fixed cost needs a name and a valid whole-dollar amount.');
          }

          const { error } = await supabase
            .from('fixed_costs')
            .update({ name, amount })
            .eq('id', Number(nameInput.dataset.id));

          if (error) throw error;
        }

        await rebuildFixedCostsEditor();

        if (selectedMonth === currentPeriod.month && selectedYear === currentPeriod.year) {
          await loadAll();
        } else {
          alert('Fixed costs saved for the selected period.');
        }
      } catch (error) {
        console.error(error);
        showError(fixedError, `Could not save fixed costs: ${error.message || error}`);
      } finally {
        document.body.classList.remove('loading');
      }
    });

    setMonth.addEventListener('change', async () => {
      try {
        const selectedSettings = await ensureSettingsForSelection();
        setStarting.value = integer(selectedSettings.starting_amount);
        setGas.value = integer(selectedSettings.gas_amount);
        setGroceries.value = integer(selectedSettings.groceries_amount);
        setEatOut.value = integer(selectedSettings.eat_out_amount);
        setExtra.value =
