<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Family Budget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --blue-900: #0f2b46;
      --blue-800: #163a5a;
      --blue-700: #1d4a6f;
      --blue-600: #255a84;
      --blue-500: #2f6f9f;
      --blue-400: #4a8fbd;
      --blue-300: #7fb3d6;
      --blue-200: #b3d4e9;
      --blue-100: #e0f0f9;
      --cream-50: #fffdf7;
      --cream-100: #fff8e9;
      --cream-200: #fff1d4;
      --cream-300: #ffe7b8;
      --cream-400: #ffd794;
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.35);
      --shadow: 0 10px 30px rgba(15, 43, 70, 0.25);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700), var(--blue-500));
      color: var(--blue-900);
      min-height: 100vh;
    }

    .wave-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .wave {
      position: absolute;
      left: -10%;
      right: -10%;
      height: 40vh;
      background: radial-gradient(ellipse at center, var(--cream-200) 0%, transparent 70%);
      opacity: 0.25;
      filter: blur(40px);
      transform: translateY(-20%);
      animation: float 12s ease-in-out infinite;
    }
    .wave:nth-child(2) {
      top: 40%;
      height: 50vh;
      background: radial-gradient(ellipse at center, var(--cream-300) 0%, transparent 70%);
      opacity: 0.2;
      animation-delay: -4s;
    }
    .wave:nth-child(3) {
      top: 75%;
      height: 45vh;
      background: radial-gradient(ellipse at center, var(--cream-100) 0%, transparent 70%);
      opacity: 0.22;
      animation-delay: -8s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(-20%) scale(1); }
      50% { transform: translateY(-10%) scale(1.05); }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .period-display {
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-weight: 600;
      color: var(--blue-800);
      flex: 1;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
      box-shadow: 0 6px 18px rgba(15,43,70,0.25);
      background: linear-gradient(135deg, var(--blue-400), var(--blue-600));
      color: white;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.secondary {
      background: linear-gradient(135deg, var(--cream-200), var(--cream-300));
      color: var(--blue-900);
    }

    .card {
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .grid {
      display: grid;
      gap: 16px;
    }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        
    @media (max-width: 900px) {
      .grid.two, .grid.three, .grid.four { grid-template-columns: 1fr; }
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue-800);
      margin: 0 0 10px;
    }

    .expense-category {
      position: relative;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cream-100), var(--cream-200));
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 22px rgba(15,43,70,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: default;
    }
    .expense-category:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15,43,70,0.22);
    }

    .cat-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--blue-700);
      margin-bottom: 6px;
    }
    .cat-remaining {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue-900);
    }
    .cat-sub {
      font-size: 0.8rem;
      color: var(--blue-600);
      margin-top: 4px;
    }

    /* Liquid glass hover window */
    .liquid-hover {
      position: absolute;
      inset: auto 0 0 0;
      transform: translateY(10px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 5;
    }
    .expense-category:hover .liquid-hover {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .liquid-window {
      margin: 0 8px 10px;
      border-radius: 14px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.35));
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 10px 26px rgba(15,43,70,0.22);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      max-height: 220px;
      overflow: auto;
    }
    .liquid-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(15,43,70,0.12);
      font-size: 0.85rem;
      color: var(--blue-800);
    }
    .liquid-item:last-child { border-bottom: none; }
    .liquid-meta {
      font-size: 0.75rem;
      color: var(--blue-600);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 0.7fr auto;
      gap: 10px;
      align-items: end;
    }
    @media (max-width: 700px) {
      .form-row { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--blue-700);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(15,43,70,0.18);
      padding: 10px 12px;
      background: rgba(255,255,255,0.9);
      color: var(--blue-900);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 3px rgba(74,143,189,0.18);
    }

    .fixed-list {
  display: flex;
  flex-direction: column;
  width: 100%;
  gap: 0;
  font-size: 0.9rem;
  color: var(--blue-800);
}
    .fixed-name { font-weight: 600; }
    .fixed-amt { font-variant-numeric: tabular-nums; }
.fixed-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 42px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(15, 43, 70, 0.08);
}

.fixed-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 42px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(15, 43, 70, 0.08);
}

.fixed-row:last-child {
  border-bottom: none;
}

.fixed-label {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-width: 0;
  cursor: pointer;
}

.fixed-label input[type="checkbox"] {
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--blue-500);
  cursor: pointer;
}

.fixed-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: break-word;
  font-weight: 600;
  color: var(--blue-800);
}

.fixed-amt {
  flex: 0 0 auto;
  min-width: 78px;
  text-align: right;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--blue-800);
}
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 43, 70, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal {
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow: auto;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(255,255,255,0.92));
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(15,43,70,0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--blue-900);
    }
    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--blue-700);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .close-btn:hover { background: rgba(15,43,70,0.06); }

    section {
  margin-bottom: 16px;
}

    .settings-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed rgba(15,43,70,0.15);
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    .error {
      color: #b00020;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="wave-bg">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="container">
    <header>
  <div class="period-display" id="periodDisplay">Loading period…</div>

  <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
    <button type="button" class="btn secondary" id="previousPeriodBtn">
      ← Previous
    </button>
    <button type="button" class="btn secondary" id="currentPeriodBtn">
      Current Period
    </button>
    <button type="button" class="btn secondary" id="nextPeriodBtn">
      Next →
    </button>
    <button type="button" class="btn secondary" id="togglePeriodBtn">
      Switch Period
    </button>
    <button type="button" class="btn" id="settingsBtn">
      Settings
    </button>
  </div>
</header>

    <section class="card">
      <div class="section-title">Add Expense</div>
      <form id="expenseForm" class="form-row">
        <div>
          <label for="category">Category</label>
          <select id="category" required>
            <option>Gas</option>
            <option>Groceries</option>
            <option>Eat Out</option>
            <option>Extra</option>
          </select>
        </div>
        <div>
          <label for="merchant">Merchant</label>
          <input id="merchant" type="text" maxlength="100" placeholder="e.g. Aldi or Amazon" required />
        </div>
               <div>
          <label for="transactionType">Type</label>
          <select id="transactionType" required>
            <option value="expense" selected>Purchase</option>
            <option value="refund">Refund</option>
          </select>
        </div>

        <div>
          <label for="amount">Amount ($)</label>
          <input id="amount" type="number" min="0" step="1" placeholder="e.g. 45" required />
        </div>
        <div>
          <label for="card">Card</label>
          <select id="card" required>
            <option>Chase</option>
            <option>AMEX</option>
            <option>Star Card</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="submit" class="btn">Add</button>
        </div>
      </form>
      <div id="formError" class="error" style="display:none;"></div>
    </section>

    <section>
      <div class="grid four" id="categoriesGrid">
        <!-- Filled by JS -->
      </div>
    </section>

    <section class="grid three">
  <div class="card">
    <div class="section-title">Fixed Expenses (This Period)</div>
    <div id="fixedList" class="fixed-list">Loading…</div>
  </div>

  <div class="card">
    <div class="section-title">Budget Summary</div>
    <div
      id="budgetSummary"
      style="font-size:0.95rem; color:var(--blue-800);"
    >
      Loading…
    </div>
  </div>

  <div class="card">
    <div class="section-title">Card Spending</div>
    <div
      id="cardSpending"
      style="font-size:0.95rem; color:var(--blue-800);"
    >
      Loading…
    </div>
  </div>
</section>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="close-btn" id="closeSettingsBtn" aria-label="Close">&times;</button>
      </div>

      <div class="settings-section">
        <div class="section-title">Period & Starting Budget</div>
        <div class="settings-grid">
          <div>
            <label for="setMonth">Month</label>
            <select id="setMonth"></select>
          </div>
          <div>
            <label for="setYear">Year</label>
            <select id="setYear"></select>
          </div>
          <div>
            <label for="setStarting">Starting Budget ($)</label>
            <input id="setStarting" type="number" min="0" step="1" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn" id="saveBudgetBtn">Save Budget</button>
          </div>
        </div>
        <div id="budgetError" class="error" style="display:none;"></div>
      </div>

      <div class="settings-section">
        <div class="section-title">Category Amounts</div>
        <div class="settings-grid">
          <div>
            <label for="setGas">Gas ($)</label>
            <input id="setGas" type="number" min="0" step="1" />
          </div>
          <div>
            <label for="setGroceries">Groceries ($)</label>
            <input id="setGroceries" type="number" min="0" step="1" />
          </div>
          <div>
            <label for="setEatOut">Eat Out ($)</label>
            <input id="setEatOut" type="number" min="0" step="1" />
          </div>
          <div>
            <label for="setExtra">Extra ($)</label>
            <input id="setExtra" type="number" step="0.01" readonly />
          </div>
          <div style="grid-column: 1 / -1;">
            <button class="btn" id="saveCategoriesBtn">Save Categories</button>
          </div>
        </div>
        <div id="categoriesError" class="error" style="display:none;"></div>
      </div>

      <div class="settings-section">
        <div class="section-title">Fixed Costs (This Period)</div>
        <div id="fixedCostsEditor" style="display:grid; gap:10px;"></div>
        <div style="margin-top:10px;">
          <button class="btn" id="addFixedBtn">Add Fixed Cost</button>
          <button class="btn secondary" id="saveFixedBtn" style="margin-left:8px;">Save Fixed Costs</button>
        </div>
        <div id="fixedError" class="error" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // =========================
    // CONFIGURE SUPABASE HERE
    // =========================
    const SUPABASE_URL = 'https://ffjaqdtdoqkvlrcfqnrx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lwdziY_FYlVNYoTh-Z2oTw_3SoDNDNr';

    // Import Supabase JS client from CDN
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // State
    let currentPeriod = { startDay: 1, month: 0, year: 0 }; // will be set on load
    let settings = null;
    let fixedCosts = [];
    let expensesByCategory = { Gas: [], Groceries: [], 'Eat Out': [], Extra: [] };

    // DOM
    const periodDisplay = document.getElementById('periodDisplay');
    const togglePeriodBtn = document.getElementById('togglePeriodBtn');
    const previousPeriodBtn = document.getElementById('previousPeriodBtn');
    const currentPeriodBtn = document.getElementById('currentPeriodBtn');
    const nextPeriodBtn = document.getElementById('nextPeriodBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const expenseForm = document.getElementById('expenseForm');
    const formError = document.getElementById('formError');
    const fixedList = document.getElementById('fixedList');
    const budgetSummary = document.getElementById('budgetSummary');
    const categoriesGrid = document.getElementById('categoriesGrid');

    // Modal elements
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const setMonth = document.getElementById('setMonth');
    const setYear = document.getElementById('setYear');
    const setStarting = document.getElementById('setStarting');
    const saveBudgetBtn = document.getElementById('saveBudgetBtn');
    const budgetError = document.getElementById('budgetError');
    const setGas = document.getElementById('setGas');
    const setGroceries = document.getElementById('setGroceries');
    const setEatOut = document.getElementById('setEatOut');
    const setExtra = document.getElementById('setExtra');
    const saveCategoriesBtn = document.getElementById('saveCategoriesBtn');
    const categoriesError = document.getElementById('categoriesError');
    const fixedCostsEditor = document.getElementById('fixedCostsEditor');
    const addFixedBtn = document.getElementById('addFixedBtn');
    const saveFixedBtn = document.getElementById('saveFixedBtn');
    const fixedError = document.getElementById('fixedError');
    function updateCalculatedExtra() {
      if (!settings && !setStarting.value) return;

      const gas = Number(setGas.value) || 0;
      const groceries = Number(setGroceries.value) || 0;
      const eatOut = Number(setEatOut.value) || 0;

      const totalFixed = fixedCosts.reduce(
        (sum, fixedCost) => sum + Number(fixedCost.amount),
        0
      );

      const extra =
        (Number(setStarting.value) || 0) -
        totalFixed -
        gas -
        groceries -
        eatOut;

      setExtra.value = extra.toFixed(2);
    }

    setGas.addEventListener('input', updateCalculatedExtra);
    setGroceries.addEventListener('input', updateCalculatedExtra);
    setEatOut.addEventListener('input', updateCalculatedExtra);
    setStarting.addEventListener('input', updateCalculatedExtra);
    
    // Helpers
    const months = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December'
    ];

    function getDaysInMonth(month, year) {
      return new Date(year, month, 0).getDate();
    }

    function periodFromDay(day) {
      return day <= 15 ? 1 : 16;
    }

    async function ensureSettings(period) {
      const { data, error } = await supabase
        .from('budget_settings')
        .select('*')
        .eq('period_start_day', period.startDay)
        .eq('month', period.month)
        .eq('year', period.year)
        .single();

      if (error && error.code !== 'PGRST116') { // PGRST116 = not found
        throw error;
      }

      if (!data) {
        // Create default
        const daysInMonth = getDaysInMonth(period.month, period.year);
        const totalFixed = period.startDay === 1
          ? (400 + 1000 + 20 + 38 + 12 + 90)
          : (400 + 1000 + 35 + 33 + 30 + 2);

        const defaultStarting = 3000; // fallback if not set yet
        const gas = 200;
        const groceries = 450;
        const eatOut = 100;
        const extra = Math.max(0, defaultStarting - totalFixed - gas - groceries - eatOut);

        const { data: inserted, error: insError } = await supabase
          .from('budget_settings')
          .insert([{
            period_start_day: period.startDay,
            month: period.month,
            year: period.year,
            starting_amount: defaultStarting,
            gas_amount: gas,
            groceries_amount: groceries,
            eat_out_amount: eatOut,
            extra_amount: extra
          }])
          .select()
          .single();

        if (insError) throw insError;
        return inserted;
      }

      return data;
    }

    async function ensureFixedCosts(period) {
      const defaults1 = [
        { name: 'Church', amount: 400 },
        { name: 'Savings', amount: 1000 },
        { name: 'Netflix', amount: 20 },
        { name: 'Apple 1 Family', amount: 38 },
        { name: 'Oura', amount: 12 },
        { name: 'TKS Internet', amount: 90 },
      ];
      const defaults2 = [
        { name: 'Church', amount: 400 },
        { name: 'Savings', amount: 1000 },
        { name: 'Prison Fellow Intl', amount: 35 },
        { name: 'HBO Max', amount: 33 },
        { name: 'Tricare Dental', amount: 30 },
        { name: 'NYT Games', amount: 2 },
      ];
      const defaults = period.startDay === 1 ? defaults1 : defaults2;

      const { data: existing } = await supabase
        .from('fixed_costs')
        .select('id, name, amount, is_paid')
        .eq('period_start_day', period.startDay)
        .eq('month', period.month)
        .eq('year', period.year);

      const existingMap = new Map((existing || []).map(r => [r.name, r.amount]));

      const toInsert = [];
      for (const d of defaults) {
        if (!existingMap.has(d.name)) {
          toInsert.push({
            period_start_day: period.startDay,
            month: period.month,
            year: period.year,
            name: d.name,
            amount: d.amount
          });
        }
      }

      if (toInsert.length) {
        await supabase.from('fixed_costs').insert(toInsert);
      }

      const { data: finalData } = await supabase
        .from('fixed_costs')
        .select('id, name, amount, is_paid')
        .eq('period_start_day', period.startDay)
        .eq('month', period.month)
        .eq('year', period.year)
        .order('name');

      return finalData || [];
    }

    async function loadExpenses(period) {
      const { data, error } = await supabase
        .from('expenses')
        .select('id, category, merchant, amount, card, transaction_type, created_at')
        .eq('period_start_day', period.startDay)
        .eq('month', period.month)
        .eq('year', period.year)
        .order('created_at', { ascending: false });

      if (error) throw error;

      const byCat = { Gas: [], Groceries: [], 'Eat Out': [], Extra: [] };
      for (const e of (data || [])) {
        if (byCat[e.category]) {
          byCat[e.category].push(e);
        }
      }
      return byCat;
    }

    function renderPeriodDisplay() {
  const today = new Date();

  const todayText = today.toLocaleDateString('en-US', {
    month: 'short',
    day: 'numeric',
    year: 'numeric'
  });

  const monthName = months[currentPeriod.month - 1];
  const daysInMonth = getDaysInMonth(currentPeriod.month, currentPeriod.year);
  const endDay = currentPeriod.startDay === 1 ? 15 : daysInMonth;

  periodDisplay.innerHTML = `
    <div>Hello, today is ${todayText}</div>
    <div><strong>Pay Period:</strong> ${monthName} ${currentPeriod.startDay}-${endDay}, ${currentPeriod.year}</div>

}

    function renderFixedList() {
     if (!fixedCosts.length) {
  fixedList.textContent = 'No fixed costs.';

}
fixedList.innerHTML = '';
for (const f of fixedCosts) {

    }
    function renderBudgetSummary() {
      if (!settings) {
        budgetSummary.textContent = 'Loading settings…';
        return;
      }
      const totalFixed = fixedCosts.reduce((s, f) => s + Number(f.amount), 0);
      const start = Number(settings.starting_amount);
      const gas = Number(settings.gas_amount);
      const groceries = Number(settings.groceries_amount);
      const eatOut = Number(settings.eat_out_amount);
      const extra = Number(settings.extra_amount);

      const spent = {
  Gas: expensesByCategory.Gas.reduce(
    (s, e) => s + (e.transaction_type === 'refund' ? -Number(e.amount) : Number(e.amount)),
    0
  ),
  Groceries: expensesByCategory.Groceries.reduce(
    (s, e) => s + (e.transaction_type === 'refund' ? -Number(e.amount) : Number(e.amount)),
    0
  ),
  'Eat Out': expensesByCategory['Eat Out'].reduce(
    (s, e) => s + (e.transaction_type === 'refund' ? -Number(e.amount) : Number(e.amount)),
    0
  ),
  Extra: expensesByCategory.Extra.reduce(
    (s, e) => s + (e.transaction_type === 'refund' ? -Number(e.amount) : Number(e.amount)),
    0
  ),
};

      const remaining = {
        Gas: Math.max(0, gas - spent.Gas),
        Groceries: Math.max(0, groceries - spent.Groceries),
        'Eat Out': Math.max(0, eatOut - spent['Eat Out']),
        Extra: Math.max(0, extra - spent.Extra),
      };

      const totalCatBudget = gas + groceries + eatOut + extra;
      const totalCatSpent = Object.values(spent).reduce((a,b)=>a+b,0);
      const totalCatRemaining = Object.values(remaining).reduce((a,b)=>a+b,0);
      
      const cardTotals = {
        Chase: 0,
        AMEX: 0,
        'Star Card': 0
      };

      Object.values(expensesByCategory)
        .flat()
        .forEach((expense) => {
          if (Object.prototype.hasOwnProperty.call(cardTotals, expense.card)) {
            const signedAmount =
              expense.transaction_type === 'refund'
                ? -Number(expense.amount)
                : Number(expense.amount);

            cardTotals[expense.card] += signedAmount;
          }
        });

      cardSpending.innerHTML = `
        <div><strong>Chase:</strong> $${cardTotals.Chase.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
        <div><strong>AMEX:</strong> $${cardTotals.AMEX.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
        <div><strong>Star Card:</strong> $${cardTotals['Star Card'].toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      `;
      
      budgetSummary.innerHTML = `
        <div><strong>Starting:</strong> $${start.toLocaleString()}</div>
        <div><strong>Fixed costs:</strong> $${totalFixed.toLocaleString()}</div>
        <div><strong>Category budgets total:</strong> $${totalCatBudget.toLocaleString()}</div>
        <div><strong>Spent (categories):</strong> $${totalCatSpent.toLocaleString()}</div>
        <div><strong>Remaining (categories):</strong> $${totalCatRemaining.toLocaleString()}</div>
      `;
    }

left.textContent = `${e.merchant || 'Unknown merchant'} — ${sign}$${Number(e.amount).toLocaleString()}`;

    async function toggleFixedPaid(id, isPaid) {
  try {
    document.body.classList.add('loading');

    const { error } = await supabase
      .from('fixed_costs')
      .update({ is_paid: isPaid })
      .eq('id', id);

    if (error) throw error;

    await loadAll();
  } catch (err) {
    console.error(err);
    alert('Error updating fixed expense: ' + (err.message || err));
  } finally {
    document.body.classList.remove('loading');
  }
}
    
async function deleteExpense(id) {
  const confirmed = window.confirm('Delete this expense?');
  if (!confirmed) return;

  try {
    document.body.classList.add('loading');

    const { error } = await supabase
      .from('expenses')
      .delete()
      .eq('id', id);

    if (error) throw error;

    await loadAll();
  } catch (err) {
    console.error(err);
    alert('Error deleting expense: ' + (err.message || err));
  } finally {
    document.body.classList.remove('loading');
  }
}
    async function loadAll() {
      try {
        document.body.classList.add('loading');
        formError.style.display = 'none';
        budgetError.style.display = 'none';
        categoriesError.style.display = 'none';
        fixedError.style.display = 'none';

        settings = await ensureSettings(currentPeriod);
        fixedCosts = await ensureFixedCosts(currentPeriod);
        expensesByCategory = await loadExpenses(currentPeriod);

        renderPeriodDisplay();
        renderFixedList();
        renderBudgetSummary();
        renderCategories();
      } catch (err) {
        console.error(err);
        alert('Error loading data: ' + (err.message || err));
      } finally {
        document.body.classList.remove('loading');
      }
    }

    // Initialize period based on today
    const today = new Date();
    currentPeriod.month = today.getMonth() + 1;
    currentPeriod.year = today.getFullYear();
    currentPeriod.startDay = periodFromDay(today.getDate());

    // Populate month/year selects in settings
    (function initSettingsSelects() {
      for (let i = 1; i <= 12; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = months[i-1];
        setMonth.appendChild(opt);
      }
      const curYear = today.getFullYear();
      for (let y = curYear - 1; y <= curYear + 2; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        setYear.appendChild(opt);
      }
    })();

        function movePeriod(direction) {
      if (direction === 'previous') {
        if (currentPeriod.startDay === 16) {
          currentPeriod.startDay = 1;
        } else {
          currentPeriod.startDay = 16;

          if (currentPeriod.month === 1) {
            currentPeriod.month = 12;
            currentPeriod.year -= 1;
          } else {
            currentPeriod.month -= 1;
          }
        }
      }

      if (direction === 'next') {
        if (currentPeriod.startDay === 1) {
          currentPeriod.startDay = 16;
        } else {
          currentPeriod.startDay = 1;

          if (currentPeriod.month === 12) {
            currentPeriod.month = 1;
            currentPeriod.year += 1;
          } else {
            currentPeriod.month += 1;
          }
        }
      }

      loadAll();
    }

    function setToActualCurrentPeriod() {
      const today = new Date();
      const day = today.getDate();

      currentPeriod = {
        startDay: day <= 15 ? 1 : 16,
        month: today.getMonth() + 1,
        year: today.getFullYear()
      };

      loadAll();
    }

    togglePeriodBtn.addEventListener('click', () => {
      currentPeriod.startDay = currentPeriod.startDay === 1 ? 16 : 1;
      loadAll();
    });

    previousPeriodBtn.addEventListener('click', () => {
      movePeriod('previous');
    });

    nextPeriodBtn.addEventListener('click', () => {
      movePeriod('next');
    });

    currentPeriodBtn.addEventListener('click', () => {
      setToActualCurrentPeriod();
    });

    // Open/close settings
    settingsBtn.addEventListener('click', async () => {
      // Pre-fill settings modal
      setMonth.value = currentPeriod.month;
      setYear.value = currentPeriod.year;
      setStarting.value = Number(settings.starting_amount);
      setGas.value = Number(settings.gas_amount);
      setGroceries.value = Number(settings.groceries_amount);
      setEatOut.value = Number(settings.eat_out_amount);
      
      // Build fixed costs editor
      await rebuildFixedCostsEditor();
      updateCalculatedExtra();

      settingsModal.style.display = 'flex';
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.style.display = 'none';
      }
    });

    // Add expense
    expenseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.style.display = 'none';
      const category = document.getElementById('category').value;
      const merchant = document.getElementById('merchant').value.trim();
      const transactionType = document.getElementById('transactionType').value;
      const amountRaw = document.getElementById('amount').value;
      const card = document.getElementById('card').value;

      const amount = Math.floor(Number(amountRaw));
      if (!merchant) {
        formError.textContent = 'Please enter a merchant.';
        formError.style.display = 'block';
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        formError.textContent = 'Amount must be a positive whole number.';
        formError.style.display = 'block';
        return;
      }

      try {
        document.body.classList.add('loading');
        const { error } = await supabase.from('expenses').insert([{
          period_start_day: currentPeriod.startDay,
          month: currentPeriod.month,
          year: currentPeriod.year,
          category,
          merchant,
          amount,
          card,
          transaction_type: transactionType
        }]);
        if (error) throw error;
        document.getElementById('merchant').value = '';
        document.getElementById('amount').value = '';
        await loadAll();
      } catch (err) {
        console.error(err);
        formError.textContent = 'Error adding expense: ' + (err.message || err);
        formError.style.display = 'block';
        document.body.classList.remove('loading');
      }
    });

    // Save budget (starting amount)
    saveBudgetBtn.addEventListener('click', async () => {
      budgetError.style.display = 'none';
      const month = Number(setMonth.value);
      const year = Number(setYear.value);
      const starting = Math.floor(Number(setStarting.value));

      if (!month || !year || !Number.isFinite(starting)) {
        budgetError.textContent = 'Invalid budget values.';
        budgetError.style.display = 'block';
        return;
      }

      try {
        document.body.classList.add('loading');
        // Upsert settings row for selected month/year/period
        const periodStartDay = currentPeriod.startDay;

        const { data: existing } = await supabase
          .from('budget_settings')
          .select('id')
          .eq('period_start_day', periodStartDay)
          .eq('month', month)
          .eq('year', year)
          .single();

        if (existing) {
          const { error } = await supabase
            .from('budget_settings')
            .update({ starting_amount: starting })
            .eq('id', existing.id);
          if (error) throw error;
        } else {
          // Create new row (keep other fields default)
          const totalFixed = periodStartDay === 1
            ? (400 + 1000 + 20 + 38 + 12 + 90)
            : (400 + 1000 + 35 + 33 + 30 + 2);
          const gas = Number(setGas.value) || 200;
          const groceries = Number(setGroceries.value) || 450;
          const eatOut = Number(setEatOut.value) || 100;
          const extra = Math.max(0, starting - totalFixed - gas - groceries - eatOut);

          const { error } = await supabase.from('budget_settings').insert([{
            period_start_day: periodStartDay,
            month,
            year,
            starting_amount: starting,
            gas_amount: gas,
            groceries_amount: groceries,
            eat_out_amount: eatOut,
            extra_amount: extra
          }]);
          if (error) throw error;
        }

        // If editing current period, refresh state
        if (month === currentPeriod.month && year === currentPeriod.year) {
          await loadAll();
        } else {
          alert('Budget saved for selected period.');
        }
      } catch (err) {
        console.error(err);
        budgetError.textContent = 'Error saving budget: ' + (err.message || err);
        budgetError.style.display = 'block';
      } finally {
        document.body.classList.remove('loading');
      }
    });

    // Save categories
    saveCategoriesBtn.addEventListener('click', async () => {
      categoriesError.style.display = 'none';
      const month = Number(setMonth.value);
      const year = Number(setYear.value);
            const gas = Number(setGas.value);
      const groceries = Number(setGroceries.value);
      const eatOut = Number(setEatOut.value);

            const totalFixed = fixedCosts.reduce(
        (sum, fixedCost) => sum + Number(fixedCost.amount),
        0
      );

      const extra = Number(settings.starting_amount) - totalFixed - gas - groceries - eatOut;
      setExtra.value = extra.toFixed(2);

      if ([gas, groceries, eatOut, extra].some(v => !Number.isFinite(v) || v < 0)) {
        categoriesError.textContent = 'Invalid category amounts.';
        categoriesError.style.display = 'block';
        return;
      }

      try {
        document.body.classList.add('loading');
        const periodStartDay = currentPeriod.startDay;

        const { data: existing } = await supabase
          .from('budget_settings')
          .select('id, starting_amount')
          .eq('period_start_day', periodStartDay)
          .eq('month', month)
          .eq('year', year)
          .single();

        if (existing) {
          const { error } = await supabase
            .from('budget_settings')
            .update({
              gas_amount: gas,
              groceries_amount: groceries,
              eat_out_amount: eatOut,
              extra_amount: extra
            })
            .eq('id', existing.id);
          if (error) throw error;
                } else {
          throw new Error(
            'Set the Starting Budget for this pay period before saving category amounts.'
          );
        }

        if (month === currentPeriod.month && year === currentPeriod.year) {
          await loadAll();
        } else {
          alert('Category amounts saved for selected period.');
        }
      } catch (err) {
        console.error(err);
        categoriesError.textContent = 'Error saving categories: ' + (err.message || err);
        categoriesError.style.display = 'block';
      } finally {
        document.body.classList.remove('loading');
      }
    });

    // Fixed costs editor
    async function rebuildFixedCostsEditor() {
      fixedCostsEditor.innerHTML = '';
      const month = Number(setMonth.value);
      const year = Number(setYear.value);
      const periodStartDay = currentPeriod.startDay;

      const { data } = await supabase
        .from('fixed_costs')
        .select('id, name, amount')
        .eq('period_start_day', periodStartDay)
        .eq('month', month)
        .eq('year', year)
        .order('name');

      const items = data || [];

      for (const item of items) {
        const row = document.createElement('div');
        row.style.display = 'grid';
        row.style.gridTemplateColumns = '1fr 120px auto';
        row.style.gap = '8px';
        row.style.alignItems = 'center';

        const nameInput = document.createElement('input');
        nameInput.value = item.name;
        nameInput.dataset.id = item.id;
        nameInput.dataset.field = 'name';

        const amtInput = document.createElement('input');
        amtInput.type = 'number';
        amtInput.min = '0';
        amtInput.step = '1';
        amtInput.value = Number(item.amount);
        amtInput.dataset.id = item.id;
        amtInput.dataset.field = 'amount';

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn secondary';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', async () => {
          try {
            document.body.classList.add('loading');
            const { error } = await supabase
              .from('fixed_costs')
              .delete()
              .eq('id', item.id);
            if (error) throw error;
            await rebuildFixedCostsEditor();
            if (month === currentPeriod.month && year === currentPeriod.year) {
              await loadAll();
            }
          } catch (err) {
            console.error(err);
            alert('Error deleting fixed cost: ' + (err.message || err));
          } finally {
            document.body.classList.remove('loading');
          }
        });

        row.appendChild(nameInput);
        row.appendChild(amtInput);
        row.appendChild(delBtn);
        fixedCostsEditor.appendChild(row);
      }
    }

    addFixedBtn.addEventListener('click', async () => {
      const month = Number(setMonth.value);
      const year = Number(setYear.value);
      const periodStartDay = currentPeriod.startDay;

      const name = prompt('Fixed cost name:');
      if (!name) return;
      const amountStr = prompt('Fixed cost amount ($):', '0');
      if (amountStr === null) return;
      const amount = Math.floor(Number(amountStr));
      if (!Number.isFinite(amount) || amount < 0) {
        alert('Invalid amount.');
        return;
      }

      try {
        document.body.classList.add('loading');
        const { error } = await supabase.from('fixed_costs').insert([{
          period_start_day: periodStartDay,
          month,
          year,
          name,
          amount
        }]);
        if (error) throw error;
        await rebuildFixedCostsEditor();
        if (month === currentPeriod.month && year === currentPeriod.year) {
          await loadAll();
        }
      } catch (err) {
        console.error(err);
        alert('Error adding fixed cost: ' + (err.message || err));
      } finally {
        document.body.classList.remove('loading');
      }
    });

    saveFixedBtn.addEventListener('click', async () => {
      fixedError.style.display = 'none';
      const inputs = fixedCostsEditor.querySelectorAll('input');
      const updates = [];
      for (const inp of inputs) {
        const id = Number(inp.dataset.id);
        const field = inp.dataset.field;
        const value = field === 'name' ? inp.value : Math.floor(Number(inp.value));
        updates.push({ id, field, value });
      }

      try {
        document.body.classList.add('loading');
        for (const u of updates) {
          const payload = {};
          payload[u.field] = u.value;
          const { error } = await supabase
            .from('fixed_costs')
            .update(payload)
            .eq('id', u.id);
          if (error) throw error;
        }
        const month = Number(setMonth.value);
        const year = Number(setYear.value);
        if (month === currentPeriod.month && year === currentPeriod.year) {
          await loadAll();
        } else {
          alert('Fixed costs saved for selected period.');
        }
      } catch (err) {
        console.error(err);
        fixedError.textContent = 'Error saving fixed costs: ' + (err.message || err);
        fixedError.style.display = 'block';
      } finally {
        document.body.classList.remove('loading');
      }
    });

    // Initial load
    loadAll();
  </script>
